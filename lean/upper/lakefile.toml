# Modified by Tejasvi Singh Tomar, 2026: default target Hl47a; libraries PartialBalayage and CenteredMaximal (the
# modules of the proof of c2 <= 3.59123) and Hl47a (statement and main theorems); Challenge and Solution are not included.
name = "partial_balayage"
version = "0.1.0"
defaultTargets = ["Hl47a"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "PartialBalayage"
globs = ["PartialBalayage.+"]

[[lean_lib]]
name = "CenteredMaximal"
globs = ["CenteredMaximal.+"]

[[lean_lib]]
name = "Hl47a"
globs = ["Hl47a.+"]
