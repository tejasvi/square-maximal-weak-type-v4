# Modified by Tejasvi Singh Tomar, 2026: derived from the lakefile of centered-maximal-constant; only the
# library `CenteredMaximal` (its submodules, without a root module) is built, and the `Challenge` and
# `Solution` libraries are removed.
name = "centered_maximal_constant"
version = "0.1.0"
defaultTargets = ["CenteredMaximal"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "CenteredMaximal"
globs = ["CenteredMaximal.+"]
